[project]
name = "mictoagent"
version = "0.1.0"
description = "语音输入桥：按住/点按右Ctrl说话，识别后送进当前 agent 会话"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 说明：本项目不作为可安装包发布，运行代码全在 voice-bridge/（脚本直跑）。
# 安装依赖请用 requirements.txt，无需 pip install -e .
dependencies = [
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "httpx>=0.28.0",
    "sherpa-onnx>=1.13.5",
    "onnxruntime>=1.20.0",
    "kaldi-native-fbank>=1.20",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
    "pypinyin>=0.50",
    "rapidfuzz>=3.0",
    "uiautomation>=2.0; platform_system == 'Windows'",
    "comtypes>=1.4; platform_system == 'Windows'",
    "Windows-Toasts>=1.3; platform_system == 'Windows'",
    "pywebview>=6.0; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
